name: "Update Sonar Properties"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama donde crear la PR'
        default: 'develop'
        required: true

jobs:
  update-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Modify sonar-project.properties
        run: |
          FILE="sonar-project.properties"
          
          if [ ! -f "$FILE" ]; then
            echo "Error: El archivo $FILE no existe."
            exit 1
          fi

          # 1. Definir el nombre del proyecto
          PROJECT_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          # 2. Definir el patrón de búsqueda EXACTO
          # Usamos comillas simples para que Bash no toque los asteriscos
          LOOK_FOR='sonar.java.binaries=\*\*/\*'
          
          # 3. Definir el bloque a insertar (usando saltos de línea literales)
          # El bloque debe empezar con un salto de línea para que no se pegue a la línea anterior
          TEMPLATE="sonar.java.libraries=/home/runner/work/$PROJECT_NAME/$PROJECT_NAME/.m2/**/*.jar\nsonar.java.test.binaries=target/test-classes\nsonar.java.test.libraries=/home/runner/work/$PROJECT_NAME/$PROJECT_NAME/.m2/**/*.jar"

          echo "Buscando patrón en $FILE..."

          # 4. Inserción con sed usando '|' como delimitador para evitar conflictos con '/'
          # La sintaxis 's|patrón|&\ncontenido|' busca el patrón y lo sustituye por 
          # sí mismo (&), un salto de línea (\n) y el contenido nuevo.
          if grep -q "sonar.java.binaries=\*\*/\*" "$FILE"; then
            sed -i "s|$LOOK_FOR|&\n$TEMPLATE|" "$FILE"
            echo "Modificación completada con éxito."
            cat "$FILE" # Esto es para que veas el resultado en los logs
          else
            echo "Error: No se encontró 'sonar.java.binaries=**/*' en el archivo."
            exit 1
          fi
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update sonar-project.properties libraries paths"
          title: "Update SonarCloud configuration for multi-module project"
          body: |
            This PR updates the `sonar-project.properties` file to include:
            - java libraries path
            - test binaries
            - test libraries
            
            Automated change generated by GitHub Actions.
          branch: "fix/sonar-config-update"
          base: ${{ github.event.inputs.target_branch }}
          delete-branch: true
