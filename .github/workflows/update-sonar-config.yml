name: "Update Sonar Properties"

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Rama donde crear la PR'
        default: 'develop'
        required: true

jobs:
  update-sonar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Modify sonar-project.properties
        run: |
          # 1. Definir variables
          FILE="sonar-project.properties"
          MATCH="sonar.java.binaries=\*\*/\*"
          
          # El nombre del repo se obtiene del contexto de GitHub
          # Ejemplo: my-org/my-spring-repo -> my-spring-repo
          PROJECT_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          
          # 2. Definir el template (escapando saltos de línea para sed si es necesario)
          # Usamos /home/runner/work/ como en tu test
          TEMPLATE="sonar.java.libraries=/home/runner/work/$PROJECT_NAME/$PROJECT_NAME/.m2/**/*.jar\nsonar.java.test.binaries=target/test-classes\nsonar.java.test.libraries=/home/runner/work/$PROJECT_NAME/$PROJECT_NAME/.m2/**/*.jar"

          # 3. Inserción usando sed
          # Busca la línea MATCH y añade el TEMPLATE justo debajo
          if grep -q "sonar.java.binaries=\*\*/\*" "$FILE"; then
            sed -i "/$MATCH/a $TEMPLATE" "$FILE"
            echo "Archivo modificado correctamente."
          else
            echo "No se encontró el patrón en $FILE"
            exit 1
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update sonar-project.properties libraries paths"
          title: "Update SonarCloud configuration for multi-module project"
          body: |
            This PR updates the `sonar-project.properties` file to include:
            - java libraries path
            - test binaries
            - test libraries
            
            Automated change generated by GitHub Actions.
          branch: "fix/sonar-config-update"
          base: ${{ github.event.inputs.target_branch }}
          delete-branch: true
