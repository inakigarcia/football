name: Apply Sonar Fix

on:
  workflow_dispatch:

jobs:
  sonar-fix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Debug repo files
        run: |
          echo "PWD=$(pwd)"
          ls -l

      - name: Apply sonar fix
        run: python3 scripts/sonar_fix.py

      - name: Create branch
        run: git checkout -b chore/sonar-libraries-fix

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add sonar-project.properties
          git commit -m "chore: add sonar java libraries and test binaries" || echo "No changes"

      - name: Push branch
        run: git push origin chore/sonar-libraries-fix

      - name: Create PR
        uses: peter-evans/create-pull-request@v5
        with:
          title: "Add sonar java libraries and test binaries"
          body: "Automated update of sonar-project.properties"
          head: chore/sonar-libraries-fix
          base: master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
